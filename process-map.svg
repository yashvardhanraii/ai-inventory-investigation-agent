<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#6b7280"/>
  </marker>
</defs>

<!-- Explicit white background so text stays visible in GitHub dark mode -->
<rect x="0" y="0" width="1200" height="1600" fill="#ffffff"/>

<style>
  .title { font: 700 42px Arial, sans-serif; fill:#4b5563; }
  .heading { font: 700 27px Arial, sans-serif; fill:#4b5563; }
  .sub { font: 400 20px Arial, sans-serif; fill:#6b7280; }
  .box { fill:#ffffff; stroke:#6b7280; stroke-width:3; }
  .ai { fill:#eef2ff; stroke:#4338ca; stroke-width:3; }
  .dash { fill:#ecfdf5; stroke:#047857; stroke-width:3; }
  .line { stroke:#6b7280; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>

<text x="600" y="60" text-anchor="middle" class="title">AI Inventory Investigation Agent</text>

<rect x="350" y="100" width="500" height="90" rx="18" class="box"/>
